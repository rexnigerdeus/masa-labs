name: vitae
description: "Vitae — Générateur de CV professionnel adapté au marché ivoirien et ouest-africain. The Everyday Co."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.15.4
  go_router: ^17.0.0
  riverpod: ^3.3.2
  flutter_riverpod: ^3.3.2
  drift: ^2.31.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.2
  flutter_animate: ^4.5.2
  lucide_icons_flutter: ^3.1.14+2
  # Spécifique Vitae
  pdf: ^3.11.2
  printing: ^5.14.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic